# Hyprlock — Gruvbox Dark

general {
    hide_cursor = true
    grace = 3
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.01
    brightness = 0.55
}

input-field {
    monitor =
    size = 320, 55
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.2
    outer_color = rgb(665c54)
    inner_color = rgb(3c3836)
    font_color = rgb(ebdbb2)
    check_color = rgb(d79921)
    fail_color = rgb(cc241d)
    placeholder_text = <span foreground="##a89984">Password…</span>
    fail_text = <span foreground="##fb4934">Wrong ($ATTEMPTS)</span>
    rounding = 10
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(ebdbb2)
    font_size = 96
    font_family = Noto Sans Mono
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgb(a89984)
    font_size = 22
    font_family = Noto Sans Mono
    position = 0, 30
    halign = center
    valign = center
}
