monitor=eDP-1,2560x1600@165,0x0,1
monitor=DP-1,3440x1440@60,auto-right,1
# explainer: the ultrawide shows up as DP-3 here, not DP-1. both kept, rules for unplugged ports are ignored
monitor=DP-3,3440x1440@60,2560x0,1


$terminal = kitty
$fileManager = dolphin
$menu = wofi --show drun


exec-once = nm-applet
exec-once = waybar
exec-once = hyprpaper
exec-once = swaync
exec-once = hypridle
exec-once = blueman-applet
exec-once = wl-paste --type text --watch cliphist store &
exec-once = wl-paste --type image --watch cliphist store &
exec-once = ~/.config/hypr/monitor-handler.sh
exec-once = /usr/lib/kf6/baloo_file    # explainer: file indexer for Dolphin search


env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Capitaine-Cursors-Gruvbox-White
env = BROWSER=zen-twilight
env = XDG_DATA_DIRS,/var/lib/flatpak/exports/share:$HOME/.local/share/flatpak/exports/share:/usr/local/share:/usr/share
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,kvantum
env = QT_PLUGIN_PATH,/usr/lib/qt6/plugins
env = HYPRSHOT_DIR,$HOME/Pictures/Screenshots


general {
    gaps_in = 7
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(ebdbb2ee) rgba(ebdbb2ee) 45deg
    col.inactive_border = rgba(504945aa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 16
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        vibrancy = 0.18
        new_optimizations = true
        xray = false
    }
}

animations {
    enabled = true

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    background_color = 0x000000
}


input {
    kb_layout = us
    follow_mouse = 1
    natural_scroll = false
    scroll_factor = 1.0
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

gestures {
    gesture = 3, horizontal, workspace
}

device {
    name = scroll_mouse
    sensitivity = -0.5
}


$mainMod = SUPER

bind = $mainMod, T, exec, $terminal
bind = $mainMod, BACKSPACE, exec, hyprlock
bind = $mainMod SHIFT, T, exec, setsid -f ~/.local/bin/theme-switch --next
bind = $mainMod, C, killactive,
bind = $mainMod, L, exit,
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, Y, togglefloating,
bind = $mainMod, SPACE, exec, wofi
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, Z, exec, zen-twilight
bind = $mainMod, S, exec, signal-desktop
bind = $mainMod, I, pin

# explainer: Claude Quick Entry comes through the GlobalShortcuts portal, so bind it by hand. id from hyprctl globalshortcuts, recheck after updates
bind = $mainMod, TAB, global, com.anthropic.Claude:022536B537371E6228CC42E031525CDD-Ctrl+Alt+Space

bind = $mainMod, E, fullscreen, 1
bind = $mainMod+SHIFT, E, fullscreen, 0

bind = $mainMod, Semicolon, layoutmsg , -0.05
bind = $mainMod, Apostrophe, layoutmsg , 0.05

bind = $mainMod, left, movewindow, l
bind = $mainMod, right, movewindow, r
bind = $mainMod, up, movewindow, u
bind = $mainMod, down, movewindow, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = SUPER_SHIFT, S, exec, hyprshot -m region -s
bind = SUPER_SHIFT, D, exec, grim -g "$(slurp)" /tmp/ocr_shot.png && tesseract /tmp/ocr_shot.png stdout -l eng 2>/dev/null | wl-copy && notify-send "OCR" "Text copied to clipboard"
bind = SUPER, V, exec, cliphist list | wofi -dmenu | cliphist decode | wl-copy
bind = SUPER, Escape, exec, wlogout --layout ~/.config/wlogout/layout --css ~/.config/wlogout/style.css --buttons-per-row 1 --margin-top 5 --margin-right 5

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -d amdgpu_bl1 -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -d amdgpu_bl1 -e4 -n2 set 5%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


debug:disable_scale_checks = true

windowrule = float on, keep_aspect_ratio on, pin on, match:title Picture-in-Picture

# decision: ignore_alpha keeps wofi's rounded corners crisp instead of blurring the edges
layerrule = blur on, ignore_alpha 0.4, match:namespace wofi

# explainer: written by theme-switch
source = ~/.config/hypr/theme-colors.conf

# explainer: Discord as a floating toggle window, Chrome --app derives the class from the URL
$discordClass = chrome-discord.com__app-Default
windowrule = float on, match:class $discordClass
windowrule = size 1100 950, match:class $discordClass
windowrule = workspace special:discord, match:class $discordClass
# decision: no position rule, floating windows center already. an unknown property silently drops every rule after it, so only verified ones here
bind = $mainMod, D, exec, ~/.config/hypr/discord-toggle.sh
